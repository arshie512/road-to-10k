name: Build phone apps

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "index.html"
      - "styles.css"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "vite.config.js"
      - "scripts/**"
      - "public/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - name: Install Android platform
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Install project dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Set health permissions and privacy settings
        run: node scripts/prepare-native.mjs android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: road-to-10k-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS simulator app
    runs-on: macos-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
      - name: Generate iOS project
        run: npx cap add ios
      - name: Set HealthKit permissions and usage text
        run: node scripts/prepare-native.mjs ios
      - name: Sync iOS project
        run: npx cap sync ios
      - name: Build iOS simulator app
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: road-to-10k-ios-simulator
          path: build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error

